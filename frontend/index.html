<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Previsão de Desastres Naturais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #333;
  }

  .container {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    padding: 35px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin-bottom: 28px;
    font-weight: 600;
    font-size: 1.9rem;
    color: #222;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  label {
    font-weight: 600;
    text-align: left;
    display: block;
    margin-bottom: 6px;
    color: #444;
    user-select: none;
  }

  input[type="number"] {
    width: 100%;
    padding: 12px 15px;
    font-size: 1rem;
    border: 1.8px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.3s ease;
    background-color: #fafafa;
    color: #333;
  }
  input[type="number"]:focus {
    border-color: #2575fc;
    background-color: #fff;
  }

  button {
    background-color: #2575fc;
    border: none;
    color: white;
    padding: 15px 0;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(37, 117, 252, 0.6);
    transition: background-color 0.3s ease, transform 0.15s ease;
  }
  button:hover {
    background-color: #1a54c0;
    transform: scale(1.05);
  }
  button:disabled {
    background-color: #94b9ff;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  #result {
    margin-top: 30px;
    font-size: 1.25rem;
    font-weight: 700;
    color: #2a7d32;
    min-height: 1.5em;
  }

  #error {
    margin-top: 15px;
    color: #d32f2f;
    font-weight: 700;
    min-height: 1.5em;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Previsão de Desastre Natural</h1>
    <form id="predictForm">
      <div>
        <label for="year">Ano</label>
        <input type="number" id="year" name="year" required min="1900" max="2100" />
      </div>
      <div>
        <label for="total_deaths">Total de Mortes</label>
        <input type="number" id="total_deaths" name="total_deaths" required min="0" />
      </div>
      <div>
        <label for="total_affected">Total Afetados</label>
        <input type="number" id="total_affected" name="total_affected" required min="0" />
      </div>
      <div>
        <label for="total_damage_usd_original">Danos (USD)</label>
        <input type="number" id="total_damage_usd_original" name="total_damage_usd_original" required min="0" step="any" />
      </div>

      <button type="submit" id="submitBtn">Prever Desastre</button>
    </form>

    <div id="result"></div>
    <div id="error"></div>
  </div>

  <script>
    const form = document.getElementById("predictForm");
    const resultDiv = document.getElementById("result");
    const errorDiv = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      resultDiv.textContent = "";
      errorDiv.textContent = "";

      const data = {
        year: Number(form.year.value),
        total_deaths: Number(form.total_deaths.value),
        total_affected: Number(form.total_affected.value),
        total_damage_usd_original: Number(form.total_damage_usd_original.value)
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Processando...";

      try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || "Erro desconhecido");
        }

        const result = await response.json();
        resultDiv.textContent = `Predição: ${result.predicted_class}`;

      } catch (error) {
        errorDiv.textContent = `Erro: ${error.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Prever Desastre";
      }
    });
  </script>

</body>
</html>
